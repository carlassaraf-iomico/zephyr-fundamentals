# Posts the homework review on a pull request, after "Homework checks" ran on it.
#
# workflow_run always runs this file from the default branch, with secrets and a
# write token, so it treats everything from the PR as data:
# - it checks out only this repository's default branch (the scripts),
# - it reads result.json from the check run's artifact and the PR's files through
#   the API, and never builds or runs them,
# - the AI call has no tools, and its output is cleaned before it is posted.
#
# Repository setup (see HOMEWORK.md, "For teachers"):
# - environment `ai-review` with secret ANTHROPIC_API_KEY, deployable from main only;
# - variables (optional): MANUAL_REVIEWER (default carlassaraf), REVIEW_MODEL
#   (default claude-opus-5-5), REVIEW_EFFORT (default medium), AI_DAILY_LIMIT
#   (default 5 per PR), CLOSE_APPROVED (default true).

name: Homework review

on:
  workflow_run:
    workflows: ['Homework checks']
    types: [completed]

permissions:
  contents: read
  actions: read         # download the check run's artifact
  pull-requests: write  # post the review, close approved PRs
  issues: write         # labels

concurrency:
  group: homework-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ai-review
    steps:
      # The default branch's scripts only; nothing from the PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Anthropic SDK
        run: pip install --quiet 'anthropic==2.5.0'

      # Data only: result.json and build logs from the check run.
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: homework-result
          path: ${{ runner.temp }}/artifacts/homework-result
        continue-on-error: true  # no artifact: post_review.py says the checks didn't finish

      - name: Review and post
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL_REVIEWER: ${{ vars.MANUAL_REVIEWER }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
          CLOSE_APPROVED: ${{ vars.CLOSE_APPROVED }}
        run: python3 .github/scripts/post_review.py --artifacts "$RUNNER_TEMP/artifacts"
