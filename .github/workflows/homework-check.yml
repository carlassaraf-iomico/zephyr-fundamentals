# Automatic checks for homework tasks.
#
# Runs on a pull request from a task branch (the submission flow, see HOMEWORK.md),
# and on a push of a task tag or branch in a student's fork, e.g.
#   git tag l3-task1 && git push origin l3-task1
# Only the job for that task runs. Results show in the run's summary page and as
# annotations on the files that need changes. On a pull request, the
# "Homework review" workflow then posts them on the PR, with the AI review.
#
# This job builds and runs the student's code, so it must never get secrets: it
# runs with a read-only token, and pull_request runs from forks get no secrets.

name: Homework checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags: ['l*-task*']
    branches: ['l*-task*']
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to check, e.g. l3-task1 (defaults to the selected ref name)'
        required: false

permissions:
  contents: read

concurrency:
  group: homework-${{ github.ref }}
  cancel-in-progress: true

env:
  # The task branch, also on pull requests (where GITHUB_REF_NAME is "<n>/merge").
  HOMEWORK_REF: ${{ github.head_ref || inputs.task || github.ref_name }}

jobs:
  # Works out the task from the branch or tag name: l4-task1, l4-task1-fix, ...
  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      task: ${{ steps.task.outputs.task }}
    steps:
      - name: Pick the task from the branch name
        id: task
        run: |
          task=""
          if [[ "$HOMEWORK_REF" =~ ^(l[2-8]-task[12])($|[^0-9]) ]]; then
            case "${BASH_REMATCH[1]}" in
              l2-task1|l3-task1|l4-task1|l5-task1|l5-task2|l6-task1|l6-task2|l7-task1|l7-task2|l8-task1|l8-task2)
                task=${BASH_REMATCH[1]} ;;
            esac
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          if [ -z "$task" ]; then
            echo "::warning::\`$HOMEWORK_REF\` is not a task name. Name the branch after the task, e.g. \`l4-task1\`."
            printf '## No task\n\n`%s` is not a task name. Name the branch after the task, e.g. `l4-task1`.\n' "$HOMEWORK_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Task: $task"
          fi

  l2-task1:
    needs: task
    if: needs.task.outputs.task == 'l2-task1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A Zephyr tree or a whole west workspace can't be set up; the check step explains why.
      - name: Check the repository layout
        id: layout
        run: echo "ok=$(python3 zephyr-course/.github/scripts/check_l2_task1.py --root zephyr-course --layout-only)" >> "$GITHUB_OUTPUT"

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup
        if: steps.layout.outputs.ok == 'true'

      # Builds app/ for the board in board.txt and writes board.json.
      - uses: ./ws/zephyr-course/.github/actions/board-build
        if: steps.layout.outputs.ok == 'true'
        with:
          app: app

      - name: Check blinky and board.txt
        run: |
          args=()
          [ "${{ steps.layout.outputs.ok }}" != true ] || args=(--build-dir build --board-info board.json)
          python3 zephyr-course/.github/scripts/check_l2_task1.py --root zephyr-course "${args[@]}" --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-result
          path: |
            ws/result.json
            ws/board.json
            ws/build.log
          if-no-files-found: ignore

  l3-task1:
    needs: task
    if: needs.task.outputs.task == 'l3-task1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Use the Kconfig parser from the same Zephyr revision the student builds with.
      - name: Fetch kconfiglib from Zephyr
        run: |
          rev=$(sed -n 's/^ *revision: *//p' west.yml | head -n1)
          mkdir -p "$RUNNER_TEMP/kconfig"
          curl -sSfL -o "$RUNNER_TEMP/kconfig/kconfiglib.py" \
            "https://raw.githubusercontent.com/zephyrproject-rtos/zephyr/${rev:-main}/scripts/kconfig/kconfiglib.py"
          echo "PYTHONPATH=$RUNNER_TEMP/kconfig" >> "$GITHUB_ENV"

      - name: Check the LED Subsystem Kconfig menu
        run: python3 .github/scripts/check_l3_task1.py --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-result
          path: result.json
          if-no-files-found: ignore

  l4-task1:
    needs: task
    if: needs.task.outputs.task == 'l4-task1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup

      # Normally app/; a separate app folder with the heartbeat work is accepted too.
      - name: Find the app folder
        id: app
        run: echo "dir=$(python3 zephyr-course/.github/scripts/check_l4_task1.py --root zephyr-course --print-app)" >> "$GITHUB_OUTPUT"

      # Builds for the board in board.txt (native_sim when there is none) and writes board.json.
      - uses: ./ws/zephyr-course/.github/actions/board-build
        with:
          app: ${{ steps.app.outputs.dir }}

      - name: Check the heartbeat LED
        env:
          APP_DIR: ${{ steps.app.outputs.dir }}
        run: >
          python3 zephyr-course/.github/scripts/check_l4_task1.py
          --root zephyr-course --app "$APP_DIR"
          --build-dir build --board-info board.json
          --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-result
          path: |
            ws/result.json
            ws/board.json
            ws/build.log
            ws/build/zephyr/zephyr.dts
            ws/build/zephyr/.config
          if-no-files-found: ignore

  # l5-task1 (copy/rename) and l5-task2 (from scratch): build Zephyr's hello_world for the custom board.
  l5:
    needs: task
    if: startsWith(needs.task.outputs.task, 'l5-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    env:
      TASK: ${{ needs.task.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The board folder Zephyr should build (empty when there is none; the check step explains).
      - name: Find the custom board
        id: board
        run: python3 zephyr-course/.github/scripts/check_l5.py --task "$TASK" --root zephyr-course --print-board --github-output "$GITHUB_OUTPUT"

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup
        if: steps.board.outputs.board != ''

      - uses: ./ws/zephyr-course/.github/actions/board-build
        if: steps.board.outputs.board != ''
        with:
          target: ${{ steps.board.outputs.board }}
          board-roots: ${{ steps.board.outputs.board-root }}
          source: deps/zephyr/samples/hello_world

      - name: Check the custom board
        env:
          FOUND: ${{ steps.board.outputs.board }}
        run: |
          args=()
          [ -z "$FOUND" ] || args=(--build-dir build --board-info board.json)
          python3 zephyr-course/.github/scripts/check_l5.py --task "$TASK" --root zephyr-course "${args[@]}" --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-result
          path: |
            ws/result.json
            ws/board.json
            ws/build.log
          if-no-files-found: ignore

  # l8-task1 (tests pass) and l8-task2 (coverage) share the build; task 2 adds coverage.
  l8:
    needs: task
    if: startsWith(needs.task.outputs.task, 'l8-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    env:
      # native_sim builds with the runner's gcc; no Zephyr SDK download needed.
      ZEPHYR_TOOLCHAIN_VARIANT: host
      TASK: ${{ needs.task.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup
        with:
          requirements: base build-test run-test

      - name: Run the ring_buf tests
        continue-on-error: true  # the next step turns the results into feedback
        run: |
          coverage=()
          if [ "$TASK" = l8-task2 ]; then
            coverage=(--coverage --coverage-tool gcovr --coverage-basedir zephyr-course/app/modules/ring_buf)
          fi
          west twister -T zephyr-course/tests/ring_buf -p native_sim --outdir twister-out --inline-logs "${coverage[@]}"

      - name: Check the tests
        run: |
          if [ "$TASK" = l8-task2 ]; then
            python3 zephyr-course/.github/scripts/check_l8_task2.py --root zephyr-course \
              --twister-out twister-out --platform native_sim --json result.json
          else
            python3 zephyr-course/.github/scripts/check_l8_task1.py --root zephyr-course \
              --twister-json twister-out/twister.json --platform native_sim --json result.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-result
          path: |
            ws/result.json
            ws/twister-out/twister.json
            ws/twister-out/coverage_summary.json
            ws/twister-out/coverage/
          if-no-files-found: ignore

  # l6-task1/2 (sensor driver, extension API) and l7-task1/2 (shell commands): build the app for
  # the board in board.txt, then check the driver and shell code and what the build compiled.
  l6-l7:
    needs: task
    if: startsWith(needs.task.outputs.task, 'l6-') || startsWith(needs.task.outputs.task, 'l7-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    env:
      TASK: ${{ needs.task.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup

      # Normally app/; another app folder with the task's work is accepted too.
      - name: Find the app folder
        id: app
        run: echo "dir=$(python3 zephyr-course/.github/scripts/check_l6_l7.py --task "$TASK" --root zephyr-course --print-app)" >> "$GITHUB_OUTPUT"

      # Builds for the board in board.txt (native_sim when there is none) and writes board.json.
      - uses: ./ws/zephyr-course/.github/actions/board-build
        with:
          app: ${{ steps.app.outputs.dir }}

      - name: Check the driver and shell code
        env:
          APP_DIR: ${{ steps.app.outputs.dir }}
        run: >
          python3 zephyr-course/.github/scripts/check_l6_l7.py --task "$TASK"
          --root zephyr-course --app "$APP_DIR"
          --build-dir build --board-info board.json
          --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-result
          path: |
            ws/result.json
            ws/board.json
            ws/build.log
            ws/build/zephyr/zephyr.dts
            ws/build/zephyr/.config
          if-no-files-found: ignore
