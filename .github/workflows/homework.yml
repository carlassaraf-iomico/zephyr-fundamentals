# Automatic feedback for homework tasks.
#
# Runs when a task tag (or a branch with the same name) is pushed, e.g.
#   git tag l3-task1 && git push origin l3-task1
# and only the job for that task runs. Results show in the run's summary page
# and as annotations on the files that need changes.
#
# This is feedback only: the course's own review is what counts.

name: Homework checks

on:
  push:
    tags: ['l*-task*']
    branches: ['l*-task*']
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to check, e.g. l3-task1 (defaults to the selected ref name)'
        required: false

permissions:
  contents: read

concurrency:
  group: homework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l2-task1:
    if: startsWith(inputs.task || github.ref_name, 'l2-task1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A Zephyr tree or a whole west workspace can't be set up; the check step explains why.
      - name: Check the repository layout
        id: layout
        run: echo "ok=$(python3 zephyr-course/.github/scripts/check_l2_task1.py --root zephyr-course --layout-only)" >> "$GITHUB_OUTPUT"

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup
        if: steps.layout.outputs.ok == 'true'

      # Builds app/ for the board in board.txt and writes board.json.
      - uses: ./ws/zephyr-course/.github/actions/board-build
        if: steps.layout.outputs.ok == 'true'
        with:
          app: app

      - name: Check blinky and board.txt
        run: |
          args=()
          [ "${{ steps.layout.outputs.ok }}" != true ] || args=(--build-dir build --board-info board.json)
          python3 zephyr-course/.github/scripts/check_l2_task1.py --root zephyr-course "${args[@]}" --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-task1-result
          path: |
            ws/result.json
            ws/board.json
            ws/build.log
          if-no-files-found: ignore

  l3-task1:
    if: startsWith(inputs.task || github.ref_name, 'l3-task1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Use the Kconfig parser from the same Zephyr revision the student builds with.
      - name: Fetch kconfiglib from Zephyr
        run: |
          rev=$(sed -n 's/^ *revision: *//p' west.yml | head -n1)
          mkdir -p "$RUNNER_TEMP/kconfig"
          curl -sSfL -o "$RUNNER_TEMP/kconfig/kconfiglib.py" \
            "https://raw.githubusercontent.com/zephyrproject-rtos/zephyr/${rev:-main}/scripts/kconfig/kconfiglib.py"
          echo "PYTHONPATH=$RUNNER_TEMP/kconfig" >> "$GITHUB_ENV"

      - name: Check the LED Subsystem Kconfig menu
        run: python3 .github/scripts/check_l3_task1.py --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-task1-result
          path: result.json
          if-no-files-found: ignore

  l4-task1:
    if: startsWith(inputs.task || github.ref_name, 'l4-task1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup

      # Normally app/; a separate app folder with the heartbeat work is accepted too.
      - name: Find the app folder
        id: app
        run: echo "dir=$(python3 zephyr-course/.github/scripts/check_l4_task1.py --root zephyr-course --print-app)" >> "$GITHUB_OUTPUT"

      # Builds for the board in board.txt (native_sim when there is none) and writes board.json.
      - uses: ./ws/zephyr-course/.github/actions/board-build
        with:
          app: ${{ steps.app.outputs.dir }}

      - name: Check the heartbeat LED
        env:
          APP_DIR: ${{ steps.app.outputs.dir }}
        run: >
          python3 zephyr-course/.github/scripts/check_l4_task1.py
          --root zephyr-course --app "$APP_DIR"
          --build-dir build --board-info board.json
          --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l4-task1-result
          path: |
            ws/result.json
            ws/board.json
            ws/build.log
            ws/build/zephyr/zephyr.dts
            ws/build/zephyr/.config
          if-no-files-found: ignore

  # l8-task1 (tests pass) and l8-task2 (coverage) share the build; task 2 adds coverage.
  l8:
    if: startsWith(inputs.task || github.ref_name, 'l8-task1') || startsWith(inputs.task || github.ref_name, 'l8-task2')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ws
    env:
      # native_sim builds with the runner's gcc; no Zephyr SDK download needed.
      ZEPHYR_TOOLCHAIN_VARIANT: host
      TASK: ${{ startsWith(inputs.task || github.ref_name, 'l8-task2') && 'l8-task2' || 'l8-task1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/zephyr-course

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./ws/zephyr-course/.github/actions/zephyr-setup
        with:
          requirements: base build-test run-test

      - name: Run the ring_buf tests
        continue-on-error: true  # the next step turns the results into feedback
        run: |
          coverage=()
          if [ "$TASK" = l8-task2 ]; then
            coverage=(--coverage --coverage-tool gcovr --coverage-basedir zephyr-course/app/modules/ring_buf)
          fi
          west twister -T zephyr-course/tests/ring_buf -p native_sim --outdir twister-out --inline-logs "${coverage[@]}"

      - name: Check the tests
        run: |
          if [ "$TASK" = l8-task2 ]; then
            python3 zephyr-course/.github/scripts/check_l8_task2.py --root zephyr-course \
              --twister-out twister-out --platform native_sim --json result.json
          else
            python3 zephyr-course/.github/scripts/check_l8_task1.py --root zephyr-course \
              --twister-json twister-out/twister.json --platform native_sim --json result.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.TASK }}-result
          path: |
            ws/result.json
            ws/twister-out/twister.json
            ws/twister-out/coverage_summary.json
            ws/twister-out/coverage/
          if-no-files-found: ignore
